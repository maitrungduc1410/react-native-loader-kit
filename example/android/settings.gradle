pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'loaderkit.example'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// Builds against a local LoaderKit core checkout instead of Maven Central:
// -PloaderKitCoreDir=<path> or LOADER_KIT_CORE_DIR=<path>, pointing at the loader-kit repository.
def loaderKitCoreDir = providers.gradleProperty('loaderKitCoreDir')
  .orElse(providers.environmentVariable('LOADER_KIT_CORE_DIR'))
  .getOrNull()
if (loaderKitCoreDir) {
  // A composite build can load only one Android Gradle plugin version, so the core build uses React Native's.
  def agpVersion = (file('../node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml').text =~ /(?m)^agp\s*=\s*"([^"]+)"/)[0][1]
  gradle.ext.loaderKitAgpVersion = agpVersion
  includeBuild(settingsDir.toPath().resolve(loaderKitCoreDir).resolve('android').toFile())
}
